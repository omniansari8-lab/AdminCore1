
name: Build AdminCore

on:
  workflow_dispatch:
  push:
    paths:
      - 'AdminCore-3.0.0-Cloud-Build-Ready.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract ZIP
        run: |
          unzip -o AdminCore-3.0.0-Cloud-Build-Ready.zip -d project
          find project -name build.gradle.kts -print

      - name: Build
        run: |
          cd project
          gradle clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: AdminCore-3.0.0
          path: project/**/build/libs/*.jar

